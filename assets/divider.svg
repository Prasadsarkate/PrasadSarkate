<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 12" fill="none">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="15%" style="stop-color:#00d2ff"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="85%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#0a0e27"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="900" height="2" rx="1" fill="url(#line)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="450" cy="5" r="3" fill="#7c3aed" opacity="0.8">
    <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
