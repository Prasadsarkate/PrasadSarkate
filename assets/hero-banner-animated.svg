<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
    <title id="title">Prasad Sarkate - Cybersecurity Developer</title>
    <desc id="desc">Animated hero banner for Prasad Sarkate, a Security-Focused Developer.</desc>
    
    <defs>
        <style>
            .font-main { font-family: 'Inter', 'Segoe UI', 'Arial', sans-serif; }
            .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
            
            .node { animation: pulse 4s infinite alternate ease-in-out; transform-origin: center; }
            .node:nth-child(even) { animation-delay: 1.5s; animation-duration: 5s; }
            .node:nth-child(3n) { animation-delay: 2.5s; animation-duration: 3.5s; }
            
            .shield-glow { animation: glow 3s infinite alternate ease-in-out; }
            
            .scanner { animation: scan 3s infinite linear; }

            @keyframes pulse {
                0% { opacity: 0.4; transform: scale(0.8); }
                100% { opacity: 1.0; transform: scale(1.3); filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.8)); }
            }
            
            @keyframes glow {
                0% { filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.4)); opacity: 0.8; }
                100% { filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.8)); opacity: 1; }
            }
            
            @keyframes scan {
                0% { transform: translateY(-70px); opacity: 0; }
                10% { opacity: 1; }
                90% { opacity: 1; }
                100% { transform: translateY(110px); opacity: 0; }
            }
            
            @media (prefers-reduced-motion: reduce) {
                .node, .shield-glow, .scanner { animation: none; }
                .node { opacity: 0.8; transform: none; }
                .scanner { display: none; }
            }
        </style>
        
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080D1B" />
            <stop offset="40%" stop-color="#111B3A" />
            <stop offset="100%" stop-color="#312E81" />
        </linearGradient>
        
        <linearGradient id="accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#A78BFA" />
        </linearGradient>

        <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.2"/>
        </linearGradient>
        
        <radialGradient id="orb" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
            <stop offset="100%" stop-color="#111B3A" stop-opacity="0"/>
        </radialGradient>
        
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
        </pattern>
        
        <filter id="glow-filter">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background Elements -->
    <rect width="1200" height="360" fill="url(#bg-grad)" />
    <rect width="1200" height="360" fill="url(#grid)" />
    
    <!-- Glow Orb -->
    <circle cx="1000" cy="180" r="250" fill="url(#orb)" />
    
    <!-- Network Lines -->
    <g stroke="url(#line-grad)" stroke-width="1.5" fill="none">
        <path d="M750,80 L880,120 L940,60 L1000,100 L1120,70" />
        <path d="M800,200 L880,120 L960,180 L1050,140 L1150,220" />
        <path d="M830,300 L900,240 L960,180" />
        <path d="M960,180 L1000,280 L1100,250" />
        <path d="M1000,100 L1050,140" />
        <path d="M1050,140 L1000,180" />
    </g>
    
    <!-- Network Nodes -->
    <g fill="#38BDF8">
        <circle cx="750" cy="80" r="3" class="node" />
        <circle cx="880" cy="120" r="3" class="node" />
        <circle cx="940" cy="60" r="3" class="node" />
        <circle cx="1120" cy="70" r="3" class="node" />
        <circle cx="800" cy="200" r="3" class="node" />
        <circle cx="960" cy="180" r="3" class="node" />
        <circle cx="1050" cy="140" r="3" class="node" />
        <circle cx="1150" cy="220" r="3" class="node" />
        <circle cx="830" cy="300" r="3" class="node" />
        <circle cx="900" cy="240" r="3" class="node" />
        <circle cx="1000" cy="280" r="3" class="node" />
        <circle cx="1100" cy="250" r="3" class="node" />
    </g>
    
    <!-- Accent Bar -->
    <rect x="60" y="60" width="7" height="240" fill="url(#accent-grad)" rx="3.5" />
    
    <!-- Text Content -->
    <g class="font-main" transform="translate(100, 0)">
        <!-- Label -->
        <text x="0" y="95" fill="#7DD3FC" font-size="17" font-weight="600" letter-spacing="4">CYBERSECURITY • SOFTWARE</text>
        
        <!-- Name -->
        <text x="0" y="155" fill="#F8FAFC" font-size="54" font-weight="800" letter-spacing="-1">PRASAD SARKATE</text>
        
        <!-- Subtitle -->
        <text x="0" y="200" fill="#CBD5E1" font-size="24" font-weight="500">Security-Focused Developer</text>
        
        <!-- Tagline -->
        <text x="0" y="245" fill="#94A3B8" font-size="17" font-weight="400">Building practical tools. Learning deeply. Designing more secure software.</text>
        
        <!-- Tech Tags -->
        <text x="0" y="290" fill="#7DD3FC" font-size="15" class="font-mono" opacity="0.9">python  /  application security  /  full stack  /  IoT</text>
    </g>
    
    <!-- Shield Icon Group (centered at 1000, 180) -->
    <g transform="translate(1000, 180)" class="shield-glow">
        <!-- Shield Base -->
        <path d="M0,-60 L50,-40 L50,10 C50,45 25,70 0,90 C-25,70 -50,45 -50,10 L-50,-40 Z" 
              fill="#080D1B" stroke="url(#accent-grad)" stroke-width="4" stroke-linejoin="round"/>
        
        <!-- Shield Inner Accent -->
        <path d="M-40,-30 L0,-46 L40,-30" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
        <path d="M-40,10 C-40,35 -20,55 0,70 C20,55 40,35 40,10" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.3"/>
        
        <!-- Checkmark -->
        <path d="M-18,15 L-5,28 L25,-8" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-filter)"/>
        
        <!-- Scanner -->
        <g class="scanner">
            <!-- Scanner Line -->
            <line x1="-55" y1="0" x2="55" y2="0" stroke="#7DD3FC" stroke-width="2" filter="url(#glow-filter)" opacity="0.9"/>
            <!-- Scanner Gradient -->
            <path d="M-50,0 L50,0 L35,-15 L-35,-15 Z" fill="#38BDF8" opacity="0.15"/>
        </g>
    </g>
</svg>
