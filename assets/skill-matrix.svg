<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="Cybersecurity Developer Skill Matrix">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight: 700; font-size: 14px; fill: #38BDF8; letter-spacing: 3px; }
      .label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight: 600; font-size: 13px; fill: #CBD5E1; }
      .percent { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight: 400; font-size: 12px; fill: #94A3B8; text-anchor: end; }
      
      @keyframes fillPython { from { width: 0; } to { width: 312.8px; } }
      @keyframes fillJS { from { width: 0; } to { width: 289px; } }
      @keyframes fillReact { from { width: 0; } to { width: 265.2px; } }
      @keyframes fillAppSec { from { width: 0; } to { width: 299.2px; } }
      @keyframes fillNetSec { from { width: 0; } to { width: 278.8px; } }
      @keyframes fillFSD { from { width: 0; } to { width: 272px; } }

      .fill-python { width: 0; animation: fillPython 1.5s ease-out forwards 0.1s; }
      .fill-js { width: 0; animation: fillJS 1.5s ease-out forwards 0.3s; }
      .fill-react { width: 0; animation: fillReact 1.5s ease-out forwards 0.5s; }
      .fill-appsec { width: 0; animation: fillAppSec 1.5s ease-out forwards 0.7s; }
      .fill-netsec { width: 0; animation: fillNetSec 1.5s ease-out forwards 0.9s; }
      .fill-fsd { width: 0; animation: fillFSD 1.5s ease-out forwards 1.1s; }

      @media (prefers-reduced-motion: reduce) {
        .fill-python { width: 312.8px !important; animation: none !important; }
        .fill-js { width: 289px !important; animation: none !important; }
        .fill-react { width: 265.2px !important; animation: none !important; }
        .fill-appsec { width: 299.2px !important; animation: none !important; }
        .fill-netsec { width: 278.8px !important; animation: none !important; }
        .fill-fsd { width: 272px !important; animation: none !important; }
      }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="16" fill="#0D1117" />
  <rect width="800" height="280" rx="16" fill="url(#grid)" />
  <rect x="1" y="1" width="798" height="278" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="42" class="title">⚡ SKILL MATRIX</text>
  <!-- Subtitle line -->
  <line x1="185" y1="37" x2="760" y2="37" stroke="#1E293B" stroke-width="1"/>

  <!-- Column Headers -->
  <text x="40" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B" letter-spacing="2" font-weight="600">DEVELOPMENT</text>
  <text x="420" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B" letter-spacing="2" font-weight="600">SECURITY</text>

  <!-- Column 1 -->
  <!-- Python -->
  <g transform="translate(40, 100)">
    <circle cx="-14" cy="-4" r="4" fill="#38BDF8" opacity="0.6"/>
    <text x="0" y="0" class="label">Python</text>
    <text x="340" y="0" class="percent">92%</text>
    <rect x="0" y="10" width="340" height="8" rx="4" fill="#1E293B" />
    <rect x="0" y="10" height="8" rx="4" fill="#38BDF8" class="fill-python" filter="url(#glow)" />
  </g>

  <!-- JavaScript -->
  <g transform="translate(40, 155)">
    <circle cx="-14" cy="-4" r="4" fill="#F59E0B" opacity="0.6"/>
    <text x="0" y="0" class="label">JavaScript</text>
    <text x="340" y="0" class="percent">85%</text>
    <rect x="0" y="10" width="340" height="8" rx="4" fill="#1E293B" />
    <rect x="0" y="10" height="8" rx="4" fill="#F59E0B" class="fill-js" filter="url(#glow)" />
  </g>

  <!-- React -->
  <g transform="translate(40, 210)">
    <circle cx="-14" cy="-4" r="4" fill="#06B6D4" opacity="0.6"/>
    <text x="0" y="0" class="label">React</text>
    <text x="340" y="0" class="percent">78%</text>
    <rect x="0" y="10" width="340" height="8" rx="4" fill="#1E293B" />
    <rect x="0" y="10" height="8" rx="4" fill="#06B6D4" class="fill-react" filter="url(#glow)" />
  </g>

  <!-- Column 2 -->
  <!-- Application Security -->
  <g transform="translate(420, 100)">
    <circle cx="-14" cy="-4" r="4" fill="#8B5CF6" opacity="0.6"/>
    <text x="0" y="0" class="label">Application Security</text>
    <text x="340" y="0" class="percent">88%</text>
    <rect x="0" y="10" width="340" height="8" rx="4" fill="#1E293B" />
    <rect x="0" y="10" height="8" rx="4" fill="#8B5CF6" class="fill-appsec" filter="url(#glow)" />
  </g>

  <!-- Network Security -->
  <g transform="translate(420, 155)">
    <circle cx="-14" cy="-4" r="4" fill="#14B8A6" opacity="0.6"/>
    <text x="0" y="0" class="label">Network Security</text>
    <text x="340" y="0" class="percent">82%</text>
    <rect x="0" y="10" width="340" height="8" rx="4" fill="#1E293B" />
    <rect x="0" y="10" height="8" rx="4" fill="#14B8A6" class="fill-netsec" filter="url(#glow)" />
  </g>

  <!-- Full Stack Dev -->
  <g transform="translate(420, 210)">
    <circle cx="-14" cy="-4" r="4" fill="#EC4899" opacity="0.6"/>
    <text x="0" y="0" class="label">Full Stack Dev</text>
    <text x="340" y="0" class="percent">80%</text>
    <rect x="0" y="10" width="340" height="8" rx="4" fill="#1E293B" />
    <rect x="0" y="10" height="8" rx="4" fill="#EC4899" class="fill-fsd" filter="url(#glow)" />
  </g>

  <!-- Bottom accent dots -->
  <circle cx="380" cy="258" r="2" fill="#38BDF8" opacity="0.3"/>
  <circle cx="392" cy="258" r="2" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="404" cy="258" r="2" fill="#14B8A6" opacity="0.3"/>
  <circle cx="416" cy="258" r="2" fill="#EC4899" opacity="0.3"/>
  <circle cx="428" cy="258" r="2" fill="#F59E0B" opacity="0.3"/>
</svg>
