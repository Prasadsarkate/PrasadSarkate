<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Cybersecurity Developer Skill Matrix">
  <defs>
    <style>
      .hdr-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 13px; fill: #38BDF8; letter-spacing: 2.5px; }
      .hdr-status { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 600; font-size: 11px; fill: #34D399; letter-spacing: 1px; }
      .sec-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #94A3B8; letter-spacing: 1.5px; }
      .skill-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
      .skill-tag { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 500; font-size: 10px; fill: #64748B; }
      .skill-pct { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 700; font-size: 12px; fill: #F8FAFC; text-anchor: end; }
      .footer-txt { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #475569; letter-spacing: 1px; }
    </style>
    
    <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38BDF8" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="g-python" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="g-js" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="g-react" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="g-node" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="g-appsec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="g-netsec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="g-pentest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="g-iot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="880" height="340" rx="14" fill="#070A12"/>
  <rect width="880" height="340" rx="14" fill="url(#cyber-grid)"/>
  <rect x="1" y="1" width="878" height="338" rx="13" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Top Decorative Tech Brackets -->
  <path d="M 14 30 L 14 14 L 30 14" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 866 30 L 866 14 L 850 14" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 14 310 L 14 326 L 30 326" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 866 310 L 866 326 L 850 326" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>

  <!-- Header Section -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="-3" r="3.5" fill="#38BDF8"/>
    <text x="16" y="1" class="hdr-title">SYSTEM CAPABILITIES // VERIFIED PROFICIENCY MATRIX</text>
    <rect x="650" y="-12" width="166" height="22" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
    <circle cx="664" cy="-1" r="3.5" fill="#34D399"/>
    <text x="676" y="3" class="hdr-status">STATUS: OPTIMIZED</text>
  </g>
  <line x1="32" y1="54" x2="848" y2="54" stroke="#1E293B" stroke-width="1"/>

  <!-- ================= COLUMN 1: DEVELOPMENT (X: 32, Width: 385) ================= -->
  <g transform="translate(32, 78)">
    <text x="0" y="0" class="sec-title">[ 01 ] CORE ENGINEERING &amp; SYSTEMS</text>
    
    <!-- Python -->
    <g transform="translate(0, 22)">
      <text x="0" y="0" class="skill-name">Python &amp; Tooling</text>
      <text x="135" y="0" class="skill-tag">AUTOMATION</text>
      <text x="385" y="0" class="skill-pct">94%</text>
      <rect x="0" y="8" width="385" height="8" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="8" width="361.9" height="8" rx="4" fill="url(#g-python)">
        <animate attributeName="width" from="0" to="361.9" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
      </rect>
    </g>

    <!-- JavaScript & TypeScript -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" class="skill-name">JavaScript / TypeScript</text>
      <text x="160" y="0" class="skill-tag">FULLSTACK</text>
      <text x="385" y="0" class="skill-pct">88%</text>
      <rect x="0" y="8" width="385" height="8" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="8" width="338.8" height="8" rx="4" fill="url(#g-js)">
        <animate attributeName="width" from="0" to="338.8" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
      </rect>
    </g>

    <!-- React -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" class="skill-name">React &amp; Modern UI</text>
      <text x="145" y="0" class="skill-tag">FRONTEND</text>
      <text x="385" y="0" class="skill-pct">82%</text>
      <rect x="0" y="8" width="385" height="8" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="8" width="315.7" height="8" rx="4" fill="url(#g-react)">
        <animate attributeName="width" from="0" to="315.7" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
      </rect>
    </g>

    <!-- Backend & REST APIs -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" class="skill-name">Backend &amp; REST APIs</text>
      <text x="155" y="0" class="skill-tag">NODE/FLASK</text>
      <text x="385" y="0" class="skill-pct">86%</text>
      <rect x="0" y="8" width="385" height="8" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="8" width="331.1" height="8" rx="4" fill="url(#g-node)">
        <animate attributeName="width" from="0" to="331.1" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
      </rect>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="440" y1="76" x2="440" y2="270" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= COLUMN 2: SECURITY (X: 463, Width: 385) ================= -->
  <g transform="translate(463, 78)">
    <text x="0" y="0" class="sec-title">[ 02 ] DEFENSIVE &amp; OFFENSIVE SECURITY</text>

    <!-- Application Security -->
    <g transform="translate(0, 22)">
      <text x="0" y="0" class="skill-name">Application Security</text>
      <text x="148" y="0" class="skill-tag">APPSEC/OWASP</text>
      <text x="385" y="0" class="skill-pct">90%</text>
      <rect x="0" y="8" width="385" height="8" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="8" width="346.5" height="8" rx="4" fill="url(#g-appsec)">
        <animate attributeName="width" from="0" to="346.5" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
      </rect>
    </g>

    <!-- Network Security -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" class="skill-name">Network Security &amp; Recon</text>
      <text x="180" y="0" class="skill-tag">PROTOCOLS</text>
      <text x="385" y="0" class="skill-pct">85%</text>
      <rect x="0" y="8" width="385" height="8" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="8" width="327.25" height="8" rx="4" fill="url(#g-netsec)">
        <animate attributeName="width" from="0" to="327.25" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
      </rect>
    </g>

    <!-- Penetration Testing -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" class="skill-name">Penetration Testing &amp; Labs</text>
      <text x="182" y="0" class="skill-tag">VULN_ASSESS</text>
      <text x="385" y="0" class="skill-pct">84%</text>
      <rect x="0" y="8" width="385" height="8" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="8" width="323.4" height="8" rx="4" fill="url(#g-pentest)">
        <animate attributeName="width" from="0" to="323.4" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
      </rect>
    </g>

    <!-- IoT & Firmware Security -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" class="skill-name">IoT &amp; Firmware Security</text>
      <text x="175" y="0" class="skill-tag">HARDWARE/OTA</text>
      <text x="385" y="0" class="skill-pct">80%</text>
      <rect x="0" y="8" width="385" height="8" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <rect x="0" y="8" width="308.0" height="8" rx="4" fill="url(#g-iot)">
        <animate attributeName="width" from="0" to="308.0" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
      </rect>
    </g>
  </g>

  <!-- Footer Micro-Metadata -->
  <line x1="32" y1="286" x2="848" y2="286" stroke="#1E293B" stroke-width="1"/>
  <g transform="translate(32, 310)">
    <circle cx="4" cy="-3" r="2.5" fill="#38BDF8"/>
    <text x="14" y="0" class="footer-txt">ARCHITECTURE: SECURE-BY-DESIGN</text>
    
    <circle cx="320" cy="-3" r="2.5" fill="#818CF8"/>
    <text x="330" y="0" class="footer-txt">EVALUATION: PRACTICAL PROOFS</text>

    <circle cx="630" cy="-3" r="2.5" fill="#34D399"/>
    <text x="640" y="0" class="footer-txt">ENCRYPTION: AES-GCM / SHA-256</text>
  </g>
</svg>