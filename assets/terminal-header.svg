<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#121638"/>
      <stop offset="100%" style="stop-color:#0a0e27"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Animated border -->
  <rect x="1" y="1" width="898" height="318" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(50,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(100,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(150,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(200,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(250,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(300,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(350,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(400,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(450,0)"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00d2ff" stroke-width="0.5" transform="translate(500,0)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#00d2ff" stroke-width="0.5" transform="translate(0,50)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#00d2ff" stroke-width="0.5" transform="translate(0,100)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#00d2ff" stroke-width="0.5" transform="translate(0,150)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#00d2ff" stroke-width="0.5" transform="translate(0,200)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#00d2ff" stroke-width="0.5" transform="translate(0,250)"/>
  </g>

  <!-- Terminal window -->
  <rect x="40" y="28" width="820" height="36" rx="8" fill="#151b3a"/>
  <circle cx="62" cy="46" r="6" fill="#ff5f57"/>
  <circle cx="82" cy="46" r="6" fill="#febc2e"/>
  <circle cx="102" cy="46" r="6" fill="#28c840"/>
  <text x="450" y="51" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" fill="#6b7280" text-anchor="middle">prasad@kali: ~/portfolio</text>

  <!-- Shield Icon -->
  <g transform="translate(350, 85)" filter="url(#glowStrong)">
    <path d="M50 5 L95 25 L95 65 C95 95 75 115 50 125 C25 115 5 95 5 65 L5 25 Z" fill="none" stroke="#00d2ff" stroke-width="2.5">
      <animate attributeName="stroke" values="#00d2ff;#7c3aed;#f59e0b;#00d2ff" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M50 20 L83 35 L83 65 C83 88 68 103 50 110 C32 103 17 88 17 65 L17 35 Z" fill="#00d2ff" opacity="0.08">
      <animate attributeName="opacity" values="0.05;0.15;0.05" dur="3s" repeatCount="indefinite"/>
    </path>
    <text x="50" y="78" font-family="Arial" font-size="40" fill="#00d2ff" text-anchor="middle" filter="url(#glow)">🛡️</text>
  </g>

  <!-- Name -->
  <text x="450" y="225" font-family="Segoe UI, system-ui, sans-serif" font-size="38" font-weight="800" fill="#e2e8f0" text-anchor="middle" letter-spacing="4" filter="url(#glow)">PRASAD SARKATE</text>
  
  <!-- Subtitle with animated color -->
  <text x="450" y="258" font-family="JetBrains Mono, Fira Code, monospace" font-size="14" text-anchor="middle" letter-spacing="2">
    <tspan fill="#00d2ff">CYBERSECURITY</tspan>
    <tspan fill="#4b5563"> ══ </tspan>
    <tspan fill="#7c3aed">FULL-STACK DEV</tspan>
    <tspan fill="#4b5563"> ══ </tspan>
    <tspan fill="#f59e0b">THREAT HUNTER</tspan>
  </text>

  <!-- Status line -->
  <g transform="translate(280, 278)">
    <circle cx="8" cy="8" r="4" fill="#28c840">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="12" font-family="JetBrains Mono, monospace" font-size="12" fill="#6b7280">STATUS:</text>
    <text x="85" y="12" font-family="JetBrains Mono, monospace" font-size="12" fill="#28c840">ONLINE</text>
    <text x="145" y="12" font-family="JetBrains Mono, monospace" font-size="12" fill="#4b5563">│</text>
    <text x="160" y="12" font-family="JetBrains Mono, monospace" font-size="12" fill="#6b7280">BUILDING:</text>
    <text x="255" y="12" font-family="JetBrains Mono, monospace" font-size="12" fill="#00d2ff">HexaScan</text>
  </g>

  <!-- Corner decorations -->
  <path d="M30 30 L30 15 L45 15" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
  <path d="M870 30 L870 15 L855 15" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <path d="M30 290 L30 305 L45 305" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <path d="M870 290 L870 305 L855 305" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Floating particles -->
  <circle cx="120" cy="150" r="1.5" fill="#00d2ff" opacity="0.5">
    <animate attributeName="cy" values="150;120;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="180" r="1" fill="#7c3aed" opacity="0.5">
    <animate attributeName="cy" values="180;140;180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="250" r="1" fill="#f59e0b" opacity="0.4">
    <animate attributeName="cy" values="250;220;250" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="100" r="1.5" fill="#00d2ff" opacity="0.3">
    <animate attributeName="cy" values="100;75;100" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
